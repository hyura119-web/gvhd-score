<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>체중 변화율 트래커</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 20px; max-width: 800px; margin: 0 auto; background-color: #f9f9f9; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .input-group { margin-bottom: 15px; display: flex; align-items: center; justify-content: space-between; }
        label { font-weight: bold; width: 120px; }
        input { padding: 8px 12px; border: 1px solid #ccc; border-radius: 6px; width: 120px; text-align: right; }
        input:disabled { background-color: #e9ecef; color: #6c757d; cursor: not-allowed; }
        button { background-color: #4CAF50; color: white; border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #45a049; }
        .btn-download { background-color: #008CBA; margin-top: 15px; width: 100%; }
        .btn-download:hover { background-color: #007bb5; }
        canvas { max-width: 100%; }
    </style>
</head>
<body>

<div class="card">
    <h2>체중 데이터 입력</h2>
    <div class="input-group">
        <label for="day0">Day 0 (기초체중):</label>
        <!-- disabled 속성으로 입력 수정 불가 고정 -->
        <input type="number" id="day0" value="70.0" step="0.1" disabled> kg
    </div>
    <div id="dynamicInputs"></div>
    <button onclick="updateChart()">그래프 갱신</button>
</div>

<div class="card">
    <canvas id="weightChart"></canvas>
    <button class="btn-download" onclick="downloadPNG()">PNG 이미지 저장</button>
</div>

<script>
    // 예시 데이터 (Day 1 ~ Day 7)
    const days = [1, 2, 3, 4, 5, 6, 7];
    const dynamicInputsDiv = document.getElementById('dynamicInputs');

    // 입력 폼 자동 생성
    days.forEach(day => {
        const div = document.createElement('div');
        div.className = 'input-group';
        div.innerHTML = `
            <label for="day${day}">Day ${day}:</label>
            <div><input type="number" id="day${day}" value="${(70 - Math.random()*2 + Math.random()*1.5).toFixed(1)}" step="0.1"> kg</div>
        `;
        dynamicInputsDiv.appendChild(div);
    });

    let chartInstance = null;

    function calculateChangeRates() {
        const baseWeight = parseFloat(document.getElementById('day0').value);
        const changeRates = [0]; // Day 0은 변화율 0%

        days.forEach(day => {
            const currentWeight = parseFloat(document.getElementById(`day${day}`).value);
            if (!isNaN(currentWeight) && baseWeight > 0) {
                // 체중변화율 계산: ((현재체중 - 기초체중) / 기초체중) * 100
                // 증가하면 +, 감소하면 -
                const rate = ((currentWeight - baseWeight) / baseWeight) * 100;
                changeRates.push(parseFloat(rate.toFixed(2)));
            } else {
                changeRates.push(null);
            }
        });

        return changeRates;
    }

    function updateChart() {
        const labels = ['Day 0', ...days.map(d => `Day ${d}`)];
        const data = calculateChangeRates();

        if (chartInstance) {
            chartInstance.destroy();
        }

        const ctx = document.getElementById('weightChart').getContext('2d');
        chartInstance = new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [{
                    label: '체중 변화율 (%)',
                    data: data,
                    borderColor: '#2196F3',
                    backgroundColor: 'rgba(33, 150, 243, 0.1)',
                    borderWidth: 2,
                    pointRadius: 5,
                    pointBackgroundColor: '#2196F3',
                    fill: true,
                    tension: 0.2
                }]
            },
            options: {
                responsive: true,
                animation: false, // 이미지 변환 시 렌더링 덜 됨 방지
                scales: {
                    y: {
                        title: { display: true, text: '변화율 (%) [+: 증가 / -: 감소]' },
                        suggestedMin: -3,
                        suggestedMax: 3,
                        grid: {
                            // 0선(중심선)을 강조하여 표현
                            color: (context) => context.tick.value === 0 ? '#000000' : '#e0e0e0',
                            lineWidth: (context) => context.tick.value === 0 ? 2 : 1
                        }
                    }
                },
                plugins: {
                    tooltip: {
                        callbacks: {
                            label: (context) => `변화율: ${context.parsed.y > 0 ? '+' : ''}${context.parsed.y}%`
                        }
                    }
                }
            }
        });
    }

    // PNG 저장 오류 완벽 해결 함수 (오프스크린 임시 캔버스 오버레이 방식)
    function downloadPNG() {
        const originalCanvas = document.getElementById('weightChart');
        
        // 1. 데이터가 비어있지 않은 임시 복사본 생성
        const tempCanvas = document.createElement('canvas');
        tempCanvas.width = originalCanvas.width;
        tempCanvas.height = originalCanvas.height;
        const tempCtx = tempCanvas.getContext('2d');

        // 2. 배경색을 하얀색으로 채움 (투명 배경 방지)
        tempCtx.fillStyle = '#FFFFFF';
        tempCtx.fillRect(0, 0, tempCanvas.width, tempCanvas.height);

        // 3. 기존 차트 그리기
        tempCtx.drawImage(originalCanvas, 0, 0);

        // 4. Data URL 추출 및 다운로드 실행
        const imageURI = tempCanvas.toDataURL('image/png');
        const link = document.createElement('a');
        link.download = 'weight_change_rate.png';
        link.href = imageURI;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    // 최초 실행
    window.onload = updateChart;
</script>

</body>
</html>
